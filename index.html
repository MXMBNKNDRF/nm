<title>Наши места</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lock card first; then a hand-drawn Moscow map (MKAD ring, river) with pins, list of places beside it */
:root {
  --bg: #F1F2EE;
  --paper: #FAFAF7;
  --ink: #1F2638;
  --muted: #646B7C;
  --line: #CDD1D8;
  --water: #B9CBD9;
  --accent: #A3365A;
  --accent-soft: #F1DCE3;
  --display: "Forum", "Times New Roman", serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151D; --paper: #1A1F2A; --ink: #E6E8EF; --muted: #9AA1B2; --line: #343B4B;
  --water: #2C4357; --accent: #E5809E; --accent-soft: #3A2430; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151D; --paper: #1A1F2A; --ink: #E6E8EF; --muted: #9AA1B2; --line: #343B4B;
  --water: #2C4357; --accent: #E5809E; --accent-soft: #3A2430; color-scheme: dark }

html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }

/* Lock */
[hidden] { display: none !important; }
.lock { min-height: 70vh; display: grid; place-items: center; }
.lock-card {
  width: 100%; max-width: 380px; background: var(--paper); border: 1px solid var(--line);
  border-radius: 14px; padding: 32px 28px; display: grid; gap: 18px; text-align: left;
}
.lock h1 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: 1.05; margin: 0; text-wrap: balance; }
.lock p { margin: 0; color: var(--muted); }
.lock form { display: grid; gap: 10px; }
.lock label { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lock input {
  font-family: var(--mono); font-size: 1.25rem; letter-spacing: .06em; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%;
}
.lock input:focus-visible, .btn:focus-visible, .place:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 0; border-radius: 10px; padding: 12px 16px; background: var(--accent); color: var(--paper);
  font-weight: 600; cursor: pointer;
}
.steps { display: flex; gap: 6px; }
.steps span { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.steps span.on { background: var(--accent); }
.err { color: var(--accent); font-size: .92rem; min-height: 1.4em; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

/* Map view */
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1; margin: 0; }
header p { margin: 8px 0 0; color: var(--muted); }
.grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.map { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: relative; }
.map svg { display: block; width: 100%; height: auto; }
.map svg { touch-action: none; cursor: grab; user-select: none; }
.map svg.drag { cursor: grabbing; }
.mkad { vector-effect: non-scaling-stroke; fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 5; }
.river { vector-effect: non-scaling-stroke; fill: none; stroke: var(--water); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.maplabel { font-family: var(--mono); font-size: 10px; fill: var(--muted); letter-spacing: .08em; }
.pin { cursor: pointer; }
.pin circle.dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; vector-effect: non-scaling-stroke; }
.pin circle.halo { fill: var(--accent); opacity: 0; transition: opacity .2s; }
.pin text { vector-effect: non-scaling-stroke; font-family: var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; pointer-events: none; }
.pin, .pin:focus, .pin:focus-visible { outline: none; }
.pin.active circle.halo, .pin:focus-visible circle.halo { opacity: .2; }
.pin.moment circle.dot { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.pin text.off { display: none; }
.pin .leader { stroke: var(--accent); stroke-width: 1.2; vector-effect: non-scaling-stroke; opacity: .7; }
.pin .anchor { fill: var(--accent); }
.pin text.num { font-family: var(--mono); font-weight: 500; fill: var(--paper); stroke: none; paint-order: normal; }
.pin.moment text.num { fill: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--paper); font-family: var(--mono); font-size: .72rem; margin-right: 10px; flex: none; }
.badge.m { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.badge.big { min-width: 30px; height: 30px; font-size: .9rem; vertical-align: 6px; }
.lname { display: flex; align-items: center; min-width: 0; }
.moment-key { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); vertical-align: -1px; margin-right: 4px; }
.dot-key { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); vertical-align: -1px; margin-right: 4px; }
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: .7rem; color: var(--muted); }

.side { display: grid; gap: 14px; min-width: 0; }
.detail { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 8px; }
.detail h2 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-family: var(--body); font-weight: 600; font-size: .8rem; }
.detail p { margin: 0; }
.track { display: flex; align-items: center; gap: 12px; margin-top: 4px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); background: var(--bg); transition: border-color .15s; }
.track:hover { border-color: var(--accent); }
.track:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.play { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); flex: none; position: relative; }
.play::after { content: ""; position: absolute; left: 12px; top: 9px; border-left: 11px solid var(--paper); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.tinfo { display: grid; min-width: 0; }
.tt { font-weight: 600; }
.ta { font-size: .82rem; color: var(--muted); }
.note p { margin: 0 0 .7em; }
.note p:last-child { margin-bottom: 0; }
.hint { margin: 0; color: var(--muted); }
.letter { border-top: 1px solid var(--line); padding-block: 40px 8px; margin-top: 12px; }
.letter-in { max-width: 62ch; margin: 0 auto; display: grid; gap: 16px; }
.letter-in p { margin: 0; font-size: 1.12rem; line-height: 1.7; text-wrap: pretty; }
.letter-in p:first-child::first-letter { font-family: var(--display); font-size: 3.1em; float: left; line-height: .9; padding: 4px 8px 0 0; color: var(--accent); }
.letter-in .track { justify-self: start; margin-top: 8px; }
.dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dhead h2 { min-width: 0; }
.close { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: .82rem; cursor: pointer; margin-top: 4px; }
.close:hover { color: var(--accent); border-color: var(--accent); }
.close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.badge.q { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); border: 0; outline: 1.5px dashed var(--accent); outline-offset: 2px; }
.mystery-pin { position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font-size: .8rem; }
.mystery-pin .mq { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 500; color: var(--accent); background: var(--paper); border: 2px dashed var(--accent); animation: drift 6s ease-in-out infinite; }
.mystery-pin .ml { background: var(--paper); padding: 1px 4px; border-radius: 4px; }
.mystery-pin.active .mq, .mystery-pin:hover .mq { background: var(--accent-soft); }
.mystery-pin:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
@keyframes drift { 0%,100% { transform: translate(0,0) rotate(0) } 33% { transform: translate(3px,-2px) rotate(20deg) } 66% { transform: translate(-2px,2px) rotate(-15deg) } }
.visit { display: grid; gap: 6px; margin-top: 6px; }
.vdate { font-family: var(--mono); font-size: .75rem; color: var(--accent); letter-spacing: .04em; }
.note { line-height: 1.6; border-left: 2px solid var(--accent); padding-left: 12px;  }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.place {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; cursor: pointer;
  padding: 9px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
}
.place:hover { background: var(--paper); }
.place[aria-current="true"] { background: var(--accent-soft); }
.place .n { font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.foot { color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<section class="lock" id="lock">
  <div class="lock-card">
    <div class="steps" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
    <h1>Наши места</h1>
    <p id="lq">Чтобы открыть карту, ответь на три вопроса. Первый — дата.</p>
    <form id="f" autocomplete="off">
      <label for="pw" id="ll">Дата</label>
      <input id="pw" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" maxlength="10" required>
      <button class="btn" type="submit" id="lb">Дальше</button>
      <div class="err" id="err" role="status"></div>
    </form>
  </div>
</section>

<main class="wrap" id="app" hidden>
  <header>
    <h1 id="ttl">Наши места</h1>
    <p id="sub"></p>
  </header>
  <div class="grid">
    <div class="map"><svg id="svg" role="img" aria-label="Карта наших мест"></svg><div class="zoom"><button type="button" id="zin" aria-label="Приблизить">+</button><button type="button" id="zout" aria-label="Отдалить">−</button><button type="button" id="zreset" aria-label="Показать всю карту">⤢</button></div><div class="legend"><span class="dot-key"></span>место · <span class="moment-key"></span>момент · пунктир — МКАД</div></div>
    <div class="side">
      <article class="detail" id="detail" aria-live="polite"></article>
      <ul class="list" id="list"></ul>
    </div>
  </div>
  <section class="letter" id="letter" hidden></section>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function canon(v) {
  const p = (v.match(/\d+/g) || []);
  let d, m, y;
  if (p.length === 3) [d, m, y] = p;
  else if (p.length === 1 && p[0].length === 8) [d, m, y] = [p[0].slice(0,2), p[0].slice(2,4), p[0].slice(4)];
  else if (p.length === 1 && p[0].length === 6) [d, m, y] = [p[0].slice(0,2), p[0].slice(2,4), p[0].slice(4)];
  else return null;
  if (y.length === 2) y = "20" + y;
  return d.padStart(2, "0") + "." + m.padStart(2, "0") + "." + y;
}
async function open(box, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const word = v => v.trim().toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]+/g, "");

const form = document.getElementById("f"), err = document.getElementById("err"), pw = document.getElementById("pw");
let box = PAYLOAD, stage = 0;
pw.addEventListener("input", () => {
  if (stage !== 0) return;
  const d = pw.value.replace(/\D/g, "").slice(0, 8);
  pw.value = d.length > 4 ? `${d.slice(0,2)}.${d.slice(2,4)}.${d.slice(4)}` : d.length > 2 ? `${d.slice(0,2)}.${d.slice(2)}` : d;
});
const shake = () => { const card = form.parentElement; card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); };
form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "";
  const v = stage === 0 ? canon(pw.value) : word(pw.value);
  if (!v) { err.textContent = stage === 0 ? "Введи дату в формате ДД.ММ.ГГГГ" : "Напиши ответ"; return; }
  let next;
  try { next = await open(box, v); }
  catch { err.textContent = stage === 0 ? "Не та дата. Попробуй ещё." : "Не совсем. Попробуй ещё."; shake(); return; }
  if (next.places) { render(next); return; }
  stage++; box = next.box;
  document.querySelectorAll(".steps span").forEach((x, i) => x.classList.toggle("on", i <= stage));
  document.getElementById("lq").textContent = next.q;
  document.getElementById("ll").textContent = "Вопрос " + (stage + 1) + " из 3";
  pw.value = ""; pw.removeAttribute("maxlength"); pw.setAttribute("inputmode", "text"); pw.placeholder = "Ответ";
  if (stage === 2) document.getElementById("lb").textContent = "Открыть";
  pw.focus();
});

  const fit = () => {
    const minx = Math.min(...xs.map(a => a[0])), maxx = Math.max(...xs.map(a => a[0]));
    const miny = Math.min(...xs.map(a => a[1])), maxy = Math.max(...xs.map(a => a[1]));
    let w = Math.max((maxx - minx) * 1.35, (maxy - miny) * 1.35 * W / H), h = w * H / W;
    return { x: (minx + maxx) / 2 - w / 2, y: (miny + maxy) / 2 - h / 2, w, h };
  };
  vb = fit();
  const MIN = W / 40;
  const R = 10; // pin radius, screen px
  const apply = () => {
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    const rect = svg.getBoundingClientRect(), sc = rect.width / vb.w || 1, VW = rect.width, VH = rect.height;
    const pins = [...svg.querySelectorAll(".pin")];
    const pts = pins.map(g => ({ g, sx: (+g.dataset.x - vb.x) * sc, sy: (+g.dataset.y - vb.y) * sc }));
    // cluster pins closer than 2.4R on screen
    const par = pts.map((_, i) => i), f = i => par[i] === i ? i : (par[i] = f(par[i]));
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++)
      if (Math.hypot(pts[i].sx - pts[j].sx, pts[i].sy - pts[j].sy) < R * 2.4) par[f(i)] = f(j);
    const groups = {}; pts.forEach((p, i) => (groups[f(i)] ||= []).push(p));
    Object.values(groups).forEach(g => {
      if (g.length === 1) { g[0].dx = g[0].sx; g[0].dy = g[0].sy; g[0].ang = null; return; }
      const cx = g.reduce((a, p) => a + p.sx, 0) / g.length, cy = g.reduce((a, p) => a + p.sy, 0) / g.length;
      const rad = Math.max(R * 2.2, (g.length * R * 2.4) / (2 * Math.PI));
      g.forEach(p => p.a0 = Math.atan2(p.sy - cy, p.sx - cx));
      g.sort((a, b) => a.a0 - b.a0);
      const base = g[0].a0;
      g.forEach((p, i) => { p.ang = base + i * 2 * Math.PI / g.length; p.dx = cx + rad * Math.cos(p.ang); p.dy = cy + rad * Math.sin(p.ang); });
    });
    // labels: place without overlapping pins, other labels or edges
    const boxes = pts.map(p => ({ x0: p.dx - R - 1, x1: p.dx + R + 1, y0: p.dy - R - 1, y1: p.dy + R + 1 }));
    boxes.push({ x0: VW - 52, x1: VW, y0: 0, y1: 140 }, { x0: 0, x1: 250, y0: VH - 26, y1: VH });
    const hit = b => b.x0 < 2 || b.y0 < 2 || b.x1 > VW - 2 || b.y1 > VH - 2 || boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
    const order = [...pts].sort((a, b) => b.g.classList.contains("active") - a.g.classList.contains("active"));
    order.forEach(p => {
      const w = p.g.querySelector(".lab").textContent.length * 6.6 + 6, h = 16, gap = R + 4;
      const cand = { r: [p.dx + gap, p.dy - h / 2, "start"], l: [p.dx - gap - w, p.dy - h / 2, "end"], b: [p.dx - w / 2, p.dy + gap - 2, "middle"], t: [p.dx - w / 2, p.dy - gap - h + 2, "middle"],
        rb: [p.dx + gap - 4, p.dy + 4, "start"], rt: [p.dx + gap - 4, p.dy - h - 4, "start"], lb: [p.dx - gap + 4 - w, p.dy + 4, "end"], lt: [p.dx - gap + 4 - w, p.dy - h - 4, "end"] };
      let pref = ["r", "l", "b", "t"];
      if (p.ang != null) { const c = Math.cos(p.ang), s2 = Math.sin(p.ang); pref = Math.abs(c) > Math.abs(s2) ? (c > 0 ? ["r", "b", "t", "l"] : ["l", "b", "t", "r"]) : (s2 > 0 ? ["b", "r", "l", "t"] : ["t", "r", "l", "b"]); }
      pref = pref.concat(["rb", "rt", "lb", "lt"]);
      p.lab = null;
      for (const k of pref) { const [x0, y0, an] = cand[k]; const b = { x0, y0, x1: x0 + w, y1: y0 + h }; if (!hit(b)) { boxes.push(b); p.lab = { k, an, x: an === "start" ? x0 + 3 : an === "end" ? x0 + w - 3 : x0 + w / 2, y: y0 + 12 }; break; } }
    });
    const u = v => v / sc;
    pts.forEach(p => {
      const g = p.g, on = g.classList.contains("active"), X = vb.x + u(p.dx), Y = vb.y + u(p.dy);
      const moved = Math.hypot(p.dx - p.sx, p.dy - p.sy) > 1;
      const L = g.querySelector(".leader"), A = g.querySelector(".anchor");
      L.setAttribute("x1", +g.dataset.x); L.setAttribute("y1", +g.dataset.y); L.setAttribute("x2", X); L.setAttribute("y2", Y); L.style.display = moved ? "" : "none";
      A.setAttribute("cx", +g.dataset.x); A.setAttribute("cy", +g.dataset.y); A.setAttribute("r", moved ? u(2.5) : 0);
      [".halo", ".dot"].forEach(c => { const e = g.querySelector(c); e.setAttribute("cx", X); e.setAttribute("cy", Y); });
      g.querySelector(".halo").setAttribute("r", u(R + 7)); g.querySelector(".dot").setAttribute("r", u(on ? R + 2 : R));
      const n = g.querySelector(".num"); n.setAttribute("x", X); n.setAttribute("y", Y + u(3.6)); n.setAttribute("font-size", u(10.5));
      const t = g.querySelector(".lab");
      if (p.lab) { t.classList.remove("off"); t.setAttribute("x", vb.x + u(p.lab.x)); t.setAttribute("y", vb.y + u(p.lab.y)); t.setAttribute("text-anchor", p.lab.an); t.setAttribute("font-size", u(12)); }
      else t.classList.add("off");
    });
    svg.querySelectorAll(".maplabel").forEach(t => t.setAttribute("font-size", u(10)));
  };
  const clamp = () => {
    vb.w = Math.min(W, Math.max(MIN, vb.w)); vb.h = vb.w * H / W;
    vb.x = Math.min(W - vb.w, Math.max(0, vb.x)); vb.y = Math.min(H - vb.h, Math.max(0, vb.y));
  };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); return [vb.x + (cx - r.left) / r.width * vb.w, vb.y + (cy - r.top) / r.height * vb.h]; };
  const zoomAt = (f, sx, sy) => { const nw = Math.min(W, Math.max(MIN, vb.w / f)), k = nw / vb.w; vb.x = sx - (sx - vb.x) * k; vb.y = sy - (sy - vb.y) * k; vb.w = nw; clamp(); apply(); };
  svg.addEventListener("wheel", e => { e.preventDefault(); const [sx, sy] = toSvg(e.clientX, e.clientY); zoomAt(Math.exp(-e.deltaY * 0.0015), sx, sy); }, { passive: false });
  const ptrs = new Map(); let moved = 0, pinch = null, downPin = null;
  svg.addEventListener("pointerdown", e => { downPin = ptrs.size ? null : e.target.closest(".pin"); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; svg.classList.add("drag");
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0]-b[0], a[1]-b[1]) }; } });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const r = svg.getBoundingClientRect();
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
      const [sx, sy] = toSvg((a[0]+b[0])/2, (a[1]+b[1])/2); zoomAt(d / pinch.d, sx, sy); pinch.d = d; moved = 99; return;
    }
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6 && !svg.hasPointerCapture(e.pointerId)) { try { svg.setPointerCapture(e.pointerId); } catch {} }
    vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h; clamp(); apply();
  });
  const up = e => { if (e.type === "pointerup" && ptrs.size === 1 && moved <= 6 && downPin) select(downPin.dataset.id, true); downPin = null; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) svg.classList.remove("drag"); };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  const center = f => zoomAt(f, vb.x + vb.w / 2, vb.y + vb.h / 2);
  document.getElementById("zin").onclick = () => center(1.6);
  document.getElementById("zout").onclick = () => center(1 / 1.6);
  document.getElementById("zreset").onclick = () => { vb = fit(); apply(); };

  svg.addEventListener("keydown", e => { const g = e.target.closest(".pin"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.dataset.id, true); } });
  list.addEventListener("click", e => { const b = e.target.closest(".place"); if (b) select(b.dataset.id, true); });
  if (data.letter) {
    const L = document.getElementById("letter"), pl = data.letter.playlist;
    L.innerHTML = `<div class="letter-in">${data.letter.paras.map(x => `<p>${x}</p>`).join("")}
      ${pl ? `<a class="track" href="${pl.url}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span class="tinfo"><span class="tt">${pl.title}</span><span class="ta">плейлист · открыть в Spotify</span></span></a>` : ""}</div>`;
    L.hidden = false;
  }
  apply();
  const HINT = `<p class="hint">Нажми на точку на карте или выбери место в списке, и здесь откроется заметка.</p>`;
  const collapse = () => {
    document.querySelectorAll(".pin").forEach(g => g.classList.remove("active"));
    document.querySelectorAll(".place").forEach(b => b.setAttribute("aria-current", "false"));
    document.querySelectorAll(".mystery-pin").forEach(b => b.classList.remove("active"));
    document.getElementById("detail").innerHTML = HINT; apply();
  };
  document.getElementById("detail").addEventListener("click", e => { if (e.target.closest("#dclose")) collapse(); });
  document.getElementById("detail").innerHTML = HINT;
  window.addEventListener("resize", apply);
}
</script>
